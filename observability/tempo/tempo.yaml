server:
  http_listen_port: 3200

distributor: # 들어오는 span을 받아 내부로 흘려보내는 Tempo 컴포넌트
  receivers:
    otlp: # receivers.otlp = otlp 포맷 span을 받겠다.
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317  # grpc로 4317 포트에서 수신. otel-collector가 여기로 넣음.

storage:
  trace: # 완성된 trace를 어디에 두는가.
    backend: local
    local:
      path: /var/tempo/blocks # local.path : flush가 끝난 트레이스 블록 파일
    wal:
      path: /var/tempo/wal # wal.path : write-ahead log. 아직 블록으로 안 굳은 진행중인 트레이스. 크래시 복구용