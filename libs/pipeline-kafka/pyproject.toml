[project]
name = "pipeline-kafka"
version = "0.1.0"
description = "Domain-agnostic Kafka transport: envelope, inbox, outbox, consumer runtime, OTel wiring"
readme = "README.md"
authors = [
    { name = "maengjh", email = "juhee.bda@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
