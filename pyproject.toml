[project]
name = "order-pipeline-choreography"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
]

[tool.uv.workspace]
members = [
    "libs/*",
    "services/*",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "pipeline-kafka",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
pipeline-kafka = { workspace = true }

[tool.ruff]
line-length = 100